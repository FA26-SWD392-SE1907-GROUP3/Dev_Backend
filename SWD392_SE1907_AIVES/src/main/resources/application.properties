spring.application.name=SWD392_SE1907_AIVES
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=AIVES;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.use_nationalized_character_data=true
server.port=${PORT:8080}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
aives.storage.path=${STORAGE_PATH:./uploads}
aives.ai.url=${AI_URL:http://localhost:11434/api/chat}
aives.ai.model=${AI_MODEL:}
aives.bootstrap.username=${ADMIN_USERNAME:}
aives.bootstrap.password=${ADMIN_PASSWORD:}
aives.bootstrap.email=${ADMIN_EMAIL:admin@aives.local}
aives.google.client-id=${GOOGLE_CLIENT_ID:}
